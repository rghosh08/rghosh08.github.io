name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - rajat
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build
        env:
          # These values are public (they ship in the client bundle), so they're safe here.
          # Override via repo variables of the same names if they ever change.
          VITE_CONSULTING_FORM_ENDPOINT: ${{ vars.VITE_CONSULTING_FORM_ENDPOINT || 'https://formspree.io/f/xeewpkab' }}
          VITE_CAL_LINK: ${{ vars.VITE_CAL_LINK || 'rghosh8/ai-consulting' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
