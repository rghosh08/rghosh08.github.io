name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - rajat
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build
        env:
          # Formspree endpoint is public (it ships in the client bundle), so it's safe here.
          # Override via a repo variable of the same name if it ever changes.
          VITE_CONSULTING_FORM_ENDPOINT: ${{ vars.VITE_CONSULTING_FORM_ENDPOINT || 'https://formspree.io/f/xeewpkab' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
